name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          PACKAGE_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PACKAGE_PATH" ]; then
            DIR=$(dirname "$PACKAGE_PATH")
            echo "Found package.json in $DIR"
            cd "$DIR" && npm install
          else
            echo "No package.json found in the repository"
            exit 1
          fi

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/edublitz-e-commerce-application-shopitry
            git pull origin main
            PACKAGE_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$PACKAGE_PATH" ]; then
              DIR=$(dirname "$PACKAGE_PATH")
              cd "$DIR"
              npm install --production
              pm2 restart shopitry-app || pm2 start server.js --name "shopitry-app" || pm2 start index.js --name "shopitry-app" || pm2 start app.js --name "shopitry-app"
            fi
